<!-- Declara documento HTML5 -->
<!DOCTYPE html>
<!-- Idioma del contenido configurado en español -->
<html lang="es">
<!-- Cabecera con metadatos y estilos -->
<head>
    <!-- Codificación UTF-8 para caracteres especiales -->
    <meta charset="UTF-8">
    <!-- Diseño adaptable a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título de la pestaña -->
    <title>CLUB ADSO</title>
    <!-- Hoja de estilos principal del proyecto -->
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>
<!-- Cuerpo de la página de registro -->
<body>
    <!-- Tarjeta contenedora del formulario de registro -->
    <div class="contenedor-formulario">
        <!-- Título del formulario -->
        <h2>Registro de Asociados Acerias</h2>
        <!-- Formulario conectado con asociados.js y ../Modelo/guardarAsociado.php -->
        <form id="formRegistro" action="../Modelo/guardarAsociado.php" method="POST">
            <!-- Campo documento de identidad (clave única en la tabla asociados) -->
            <div class="grupo-input">
                <label for="documento">Documento</label> 
                <input id="documento" name="documento" type="number" required placeholder="ej: 1012345678">
            </div>
            <!-- Campo nombres del asociado -->
            <div class="grupo-input">
                <label for="nombres">Nombre</label>
                <input id="nombres" name="nombres" type="text" required placeholder="ej: Juana">
            </div>
            <!-- Campo apellidos del asociado -->
            <div class="grupo-input">
                <label for="apellidos">Apellido</label>
                <input id="apellidos" name="apellidos" type="text" required placeholder="ej: Gonzalez">
            </div>
            <!-- Campo teléfono o celular -->
            <div class="grupo-input">
                <label for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" required placeholder="ej: 3001234567">
            </div>
            <!-- Campo correo electrónico (usado posteriormente para iniciar sesión) -->
            <div class="grupo-input">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required placeholder="ej: juana@gmail.com">
            </div>
            <!-- Campo fecha de nacimiento -->
            <div class="grupo-input">
                <label for="FechaNacimiento">Fecha de nacimiento</label>
                <input id="FechaNacimiento" name="FechaNacimiento" type="date" required>
            </div>
            <!-- Campo dirección de residencia -->
            <div class="grupo-input">
                <label for="DireccionResidencia">Dirección</label>
                <input id="DireccionResidencia" name="DireccionResidencia" type="text" required placeholder="ej: Cra 6 #15A-15">
            </div>
            <!-- Desplegable para seleccionar la ciudad de residencia -->
            <div class="grupo-input">
                <label for="ciudad">Ciudad</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="" disabled selected>Seleccione una ciudad</option>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                    <option value="Bogota">Bogotá</option>
                </select>               
            </div>
            <!-- Campo contraseña (mínimo 4 caracteres; se encripta con password_hash en PHP) -->
            <div class="grupo-input">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contraseña" minlength="4" autocomplete="new-password" required placeholder="Ingrese su contraseña">
            </div>
            <!-- Campo de confirmación para validar en asociados.js que ambas contraseñas coincidan -->
            <div class="grupo-input">
                <label for="confirmarContrasena">Confirmar Contraseña:</label>
                <input type="password" id="confirmarContrasena" name="confirmarContraseña" minlength="4" autocomplete="new-password" required placeholder="Confirme su contraseña">
            </div>
            <!-- Selección de género mediante botones de opción (radio) -->
            <div class="grupo-input">
                <label>Género:</label>
                <label><input type="radio" name="genero" value="Femenino" required> Femenino</label>
                <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
                <label><input type="radio" name="genero" value="Otro"> Otro</label>
            </div>
            <!-- Botones para guardar el registro o limpiar el formulario -->
            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>
            <!-- Enlace directo hacia el inicio de sesión si ya posee una cuenta -->
            <p class="texto-link">
                ¿Ya tienes una cuenta?
                <a href="Login.html">Inicia sesión aquí</a>
            </p>
            <!-- Párrafo dinámico donde asociados.js muestra éxito o errores del registro -->
            <p id="mensajeRegistro" role="status" aria-live="polite"></p>
        </form>
    </div>
    <!-- Controlador JS que valida contraseñas, envía JSON y redirige a Login.html -->
    <script src="../Controladores/asociados.js?v=2"></script>
</body>
</html>
