<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ADSO</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Registro de Asociados Acerias</h2>
        <form id="formRegistro" action="../Modelo/guardarAsociado.php" method="POST">
            <div class="grupo-input">
                <label for="documento">Documento</label> 
                <input id="documento" name="documento" type="number" required placeholder="ej: 1012345678">
            </div>
            <div class="grupo-input">
                <label for="nombres">Nombre</label>
                <input id="nombres" name="nombres" type="text" required placeholder="ej: Juana">
            </div>
            <div class="grupo-input">
                <label for="apellidos">Apellido</label>
                <input id="apellidos" name="apellidos" type="text" required placeholder="ej: Gonzalez">
            </div>
            <div class="grupo-input">
                <label for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" required placeholder="ej: 3001234567">
            </div>
            <div class="grupo-input">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required placeholder="ej: juana@gmail.com">
            </div>
            <div class="grupo-input">
                <label for="FechaNacimiento">Fecha de nacimiento</label>
                <input id="FechaNacimiento" name="FechaNacimiento" type="date" required>
            </div>
            <div class="grupo-input">
                <label for="DireccionResidencia">Dirección</label>
                <input id="DireccionResidencia" name="DireccionResidencia" type="text" required placeholder="ej: Cra 6 #15A-15">
            </div>
            <div class="grupo-input">
                <label for="ciudad">Ciudad</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="" disabled selected>Seleccione una ciudad</option>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                    <option value="Bogota">Bogotá</option>
                </select>               
            </div>
            <div class="grupo-input">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contraseña" minlength="4" autocomplete="new-password" required placeholder="Ingrese su contraseña">
            </div>
            <div class="grupo-input">
                <label for="confirmarContrasena">Confirmar Contraseña:</label>
                <input type="password" id="confirmarContrasena" name="confirmarContraseña" minlength="4" autocomplete="new-password" required placeholder="Confirme su contraseña">
            </div>
            <div class="grupo-input">
                <label>Género:</label>
                <label><input type="radio" name="genero" value="Femenino" required> Femenino</label>
                <label><input type="radio" name="genero" value="Masculino"> Masculino</label>
                <label><input type="radio" name="genero" value="Otro"> Otro</label>
            </div>
            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>
            <p id="mensajeRegistro" role="status" aria-live="polite"></p>
        </form>
    </div>
    <!-- Dejar solo la ruta correcta de tu script -->
    <script src="../Controladores/asociado.js"></script>
</body>
</html>
