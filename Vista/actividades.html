<!-- Declara documento HTML5 -->
<!DOCTYPE html>
<!-- Idioma español -->
<html lang="es">

<!-- Cabecera con Bootstrap, íconos y hoja de estilos -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/estilos.css?v=5">
</head>

<!-- Cuerpo de vista interna con tema dinámico según el rol -->
<body class="body-gestion">

    <!-- Barra de navegación superior fija -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <!-- Marca GESTIÓN que regresa al panel principal -->
            <a class="navbar-brand" style="color: var(--neon-green); font-weight: bold;" href="dashboard.html?v=3">
                <i class="bi bi-layers-fill"></i> GESTIÓN
            </a>
            <!-- Botón menú móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <!-- Enlaces de módulos y botón de cierre de sesión -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="asociados.html?v=3"><i class="bi bi-people"></i>
                            Asociados</a></li>
                    <!-- Módulo activo actual: Actividades -->
                    <li class="nav-item"><a class="nav-link active" href="actividades.html?v=3"><i
                                class="bi bi-calendar-event"></i> Actividades</a></li>
                    <li class="nav-item"><a class="nav-link" href="pagos.html?v=3"><i class="bi bi-cash-coin"></i> Pagos</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="prestamos.html?v=3"><i class="bi bi-bank"></i>
                            Préstamos</a></li>
                    <!-- Enlace Reportes visible únicamente para rol Admin -->
                    <li class="nav-item d-none" data-solo-admin><a class="nav-link" href="reportes.html?v=1"><i
                                class="bi bi-graph-up-arrow"></i> Reportes</a></li>
                    <!-- Botón para cerrar sesión -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button type="button" class="btn btn-danger btn-sm btn-cerrar-sesion" onclick="cerrarSesion()">
                            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container">
        <!-- Sección de formulario visible únicamente para rol Admin -->
        <div id="seccionFormActividad" data-solo-admin class="row justify-content-center d-none">
            <div class="col-lg-8 col-md-10">
                <div class="glass-card">
                    <!-- Encabezado dinámico: "Nueva Actividad" o "Editar Actividad" -->
                    <h3 id="tituloFormActividad" class="mb-4 text-center" style="color: var(--neon-green);">
                        <i class="bi bi-calendar-plus"></i> Nueva Actividad
                    </h3>
                    <!-- Formulario controlado por actividades.js -->
                    <form id="formActividad">
                        <!-- Campo oculto con el idActividad cuando se edita un registro -->
                        <input type="hidden" id="idActividad" name="idActividad">
                        <div class="row g-3">
                            <!-- Nombre de la actividad -->
                            <div class="col-md-8">
                                <label for="nombreActividad" class="form-label">Nombre de la Actividad</label>
                                <input type="text" id="nombreActividad" name="nombreActividad" class="form-control" maxlength="50" required>
                            </div>
                            <!-- Fecha programada del evento -->
                            <div class="col-md-4">
                                <label for="fechaEvento" class="form-label">Fecha Programada</label>
                                <input type="date" id="fechaEvento" name="fechaEvento" class="form-control" required>
                            </div>
                            <!-- Municipio donde se realiza la actividad -->
                            <div class="col-md-6">
                                <label for="municipio" class="form-label">Municipio</label>
                                <input type="text" id="municipio" name="municipio" class="form-control" maxlength="50" required>
                            </div>
                            <!-- Campo informativo opcional de cupo máximo -->
                            <div class="col-md-6">
                                <label for="cupoMaximo" class="form-label">Cupo Máximo</label>
                                <input type="number" id="cupoMaximo" name="cupoMaximo" class="form-control" min="1">
                            </div>
                            <!-- Campo Total Recaudado (se muestra solo al editar una actividad existente) -->
                            <div id="campoTotalRecaudado" class="col-md-6 d-none">
                                <label for="totalRecaudo" class="form-label">Total Recaudado (COP)</label>
                                <input type="number" id="totalRecaudo" name="totalRecaudado" class="form-control" step="0.01" min="0">
                            </div>
                            <!-- Botones de acción del formulario -->
                            <div class="col-12 mt-4 text-end">
                                <button type="button" id="cancelarEdicion" class="btn btn-secondary px-4 me-2 d-none">Cancelar</button>
                                <button type="submit" id="guardarActividad" class="btn btn-custom px-4">Crear Actividad</button>
                            </div>
                            <!-- Mensaje de confirmación o error -->
                            <div class="col-12">
                                <p id="mensajeActividad" class="mb-0 text-white fw-semibold" role="status"></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- Tabla de actividades (visible para ambos roles; Acciones solo para Admin) -->
        <div id="seccionTablaActividades" class="row justify-content-center mt-4">
            <div class="col-lg-10">
                <div class="card shadow-sm">
                    <!-- Encabezado con contador total de actividades -->
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-calendar-event me-2"></i>Actividades Registradas</h5>
                        <span id="totalActividades" class="badge bg-secondary">0</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Actividad</th>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Municipio</th>
                                    <th scope="col">Total recaudado</th>
                                    <!-- Columna Acciones visible únicamente para Admin -->
                                    <th id="encabezadoAcciones" data-solo-admin class="d-none" scope="col">
                                        Acciones
                                    </th>
                                </tr>
                            </thead>
                            <!-- Filas generadas dinámicamente por actividades.js -->
                            <tbody id="listaActividades">
                                <tr>
                                    <td colspan="6" class="text-center py-4">
                                        Cargando actividades...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap, sesión/tema y CRUD de actividades -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/sesion.js?v=4"></script>
    <script src="../Controladores/actividades.js?v=3"></script>
</body>

</html>
