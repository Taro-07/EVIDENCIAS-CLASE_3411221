
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Iniciar Sesión - CLUB ADSO</title>
    <!-- Ruta actualizada a tu archivo principal -->
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Bienvenido de nuevo a Acerias</p>

        <form id="formLogin" action="" method="post">
            <div class="grupo-input">
                <label for="DocumentoLogin">Documento:</label>
                <input id="DocumentoLogin" type="number" required placeholder="Ejemplo: 1057000111">
            </div>

            <div class="grupo-input">
                <label for="Password">Contraseña:</label>
                <input id="Password" type="password" required placeholder="Ingresa tu contraseña">
            </div>

            <div class="opciones-extra">
                <label class="recordar">
                    <input type="checkbox"> Recordarme
                </label>
                <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="grupo-botones">
                <button type="submit" class="btn-ingresar">Ingresar</button>
            </div>
            
            <div class="registro-link">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </form>
    </div>
</body>
</html>
