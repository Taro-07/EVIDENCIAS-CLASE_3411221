<!-- Declara que el documento utiliza el estándar HTML5 -->
<!DOCTYPE html>
<!-- Elemento raíz del documento con idioma configurado en español -->
<html lang="es">
<!-- Cabecera con metadatos y redirección automática -->
<head>
    <!-- Define la codificación de caracteres UTF-8 para admitir tildes y la ñ -->
    <meta charset="UTF-8">
    <!-- Redirige automáticamente a los 0 segundos hacia la pantalla de inicio de sesión -->
    <meta http-equiv="refresh" content="0; url=Vista/Login.html">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>MR CLUB</title>
</head>
<!-- Cuerpo del documento -->
<body>
    <!-- Script de respaldo en JavaScript para asegurar la redirección al Login -->
    <script>
        // Cambia la URL actual del navegador hacia la vista de inicio de sesión
        window.location.href = "Vista/Login.html";
    </script>
</body>
</html>
